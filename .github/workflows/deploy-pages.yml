name: Deploy GitHub Pages

on:
  # Pages currently serves the locally built gh-pages branch with .nojekyll.
  # Restore the Pages source to GitHub Actions before using this workflow.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"

      - name: Validate calendar dates
        run: pnpm run test:dates

      - name: Validate private deadline bridge
        run: pnpm run test:deadlines

      - name: Build static site
        run: pnpm run build:pages
        env:
          PAGES_BASE_PATH: /pmsc-ai-calendar-2026-27
          NEXT_PUBLIC_BASE_PATH: /pmsc-ai-calendar-2026-27
          NEXT_PUBLIC_SITE_URL: https://kl1me.github.io

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
